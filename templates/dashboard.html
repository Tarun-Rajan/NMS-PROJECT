<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Network Monitor Dashboard</title>
  <meta http-equiv="refresh" content="3">
  <style>
    body { font-family: Arial; background-color: #0b0f14; color: #e8eef6; text-align:center; }
    h1 { margin-top: 30px; }
    table { margin:auto; border-collapse: collapse; width: 60%; background:#101820; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #1f2a35; }
    tr:hover { background-color:#1a2330; }
    .up { color: #16c784; font-weight: bold; }
    .down { color: #ff6b6b; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🌐 Network Device Status</h1>
  <table>
    <tr><th>Device</th><th>Endpoint</th><th>Status</th></tr>
    {% for name, info in devices.items() %}
      <tr>
        <td>{{ name }}</td>
        <td>{{ info.ip }}</td>
        <td class="{{ 'up' if info.status else 'down' }}">
          {{ '🟢 Active' if info.status else '🔴 Down' }}
        </td>
      </tr>
    {% endfor %}
  </table>
</body>
</html>
