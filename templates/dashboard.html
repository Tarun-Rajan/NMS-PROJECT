<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Disaster Recovery Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        body {
            background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            transition: background 0.5s ease-in-out;
        }

        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

        .highlight { animation: highlightChange 0.8s ease-in-out; }
        @keyframes highlightChange {
            0% { background-color: rgba(34,197,94,0.3); }
            100% { background-color: transparent; }
        }

        .card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease-in-out;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(45,212,191,0.2);
        }

        .btn {
            transition: all 0.2s ease-in-out;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .log-entry {
            border-left: 3px solid #22c55e;
            padding-left: 8px;
            margin-bottom: 6px;
        }

        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center py-10">
    <h1 class="text-4xl font-bold mb-8 tracking-wide text-teal-400 drop-shadow-lg">🌐 Disaster Recovery Dashboard</h1>

    <!-- Summary Cards -->
    <div class="flex flex-wrap justify-center gap-6 mb-10">
        <div class="card rounded-2xl px-6 py-4 text-center w-44 fade-in">
            <p class="text-gray-400 text-sm">Total Servers</p>
            <h3 id="totalCount" class="text-3xl font-bold text-white">0</h3>
        </div>
        <div class="card rounded-2xl px-6 py-4 text-center w-44 fade-in">
            <p class="text-gray-400 text-sm">Active (UP)</p>
            <h3 id="upCount" class="text-3xl font-bold text-green-400">0</h3>
        </div>
        <div class="card rounded-2xl px-6 py-4 text-center w-44 fade-in">
            <p class="text-gray-400 text-sm">Inactive (DOWN)</p>
            <h3 id="downCount" class="text-3xl font-bold text-red-400">0</h3>
        </div>
    </div>

    <!-- Add Server -->
    <div class="mb-8 flex gap-4">
        <input id="serverName" class="px-4 py-2 rounded-lg bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="Enter server name">
        <button onclick="addServer()" class="btn bg-teal-500 hover:bg-teal-600 px-4 py-2 rounded-lg text-white font-semibold">Add Server</button>
    </div>

    <!-- Server Table -->
    <div class="w-11/12 lg:w-3/4 bg-slate-900/70 p-6 rounded-2xl shadow-xl backdrop-blur-lg fade-in">
        <h2 class="text-xl font-semibold mb-4 text-teal-300">Servers</h2>
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="border-b border-gray-700 text-gray-400 uppercase text-sm tracking-wide">
                    <th class="py-2">ID</th>
                    <th>Name</th>
                    <th>Port</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="serverTable"></tbody>
        </table>
    </div>

    <!-- Logs -->
    <div class="w-11/12 lg:w-3/4 mt-8 bg-slate-900/70 p-6 rounded-2xl shadow-xl backdrop-blur-lg fade-in">
        <h2 class="text-xl font-semibold mb-3 text-teal-300">Logs</h2>
        <div id="logs" class="h-56 overflow-y-auto text-sm space-y-1"></div>
    </div>

    <script>
        let previousStates = {};
        let firstLoad = true;

        async function fetchStatus() {
            try {
                const res = await axios.get("/status");
                const servers = res.data.servers;
                const table = document.getElementById("serverTable");

                let upCount = 0, downCount = 0;
                servers.forEach(s => {
                    if (s.status === "UP") upCount++;
                    else downCount++;

                    const prev = previousStates[s.id];
                    if (!prev || JSON.stringify(prev) !== JSON.stringify(s)) {
                        updateOrAddRow(s, prev);
                        previousStates[s.id] = s;
                    }
                });

                // Update counts
                document.getElementById("totalCount").textContent = servers.length;
                document.getElementById("upCount").textContent = upCount;
                document.getElementById("downCount").textContent = downCount;

                // Remove deleted servers
                for (const id in previousStates) {
                    if (!servers.find(s => s.id == id)) {
                        delete previousStates[id];
                        const row = document.getElementById(`server-${id}`);
                        if (row) row.remove();
                    }
                }

                if (firstLoad) {
                    firstLoad = false;
                    document.querySelectorAll(".server-row").forEach(r => r.classList.add("fade-in"));
                }
            } catch (err) {
                console.error("Error fetching status", err);
            }
        }

        function updateOrAddRow(s, prev) {
            const table = document.getElementById("serverTable");
            const existingRow = document.getElementById(`server-${s.id}`);
            const color = s.status === "UP" ? "text-green-400 pulse" : "text-red-400";
            const roleColor = s.role === "Primary" ? "text-yellow-400 font-bold" : "text-gray-400";

            const rowHTML = `
                <td class="py-2">${s.id}</td>
                <td>${s.name}</td>
                <td>${s.port}</td>
                <td class="${roleColor}">${s.role}</td>
                <td class="${color} font-semibold">${s.status}</td>
                <td>
                    <button onclick="startServer(${s.id})" class="btn bg-blue-500 hover:bg-blue-600 px-2 py-1 rounded text-white text-sm mr-1">Start</button>
                    <button onclick="failServer(${s.id})" class="btn bg-red-500 hover:bg-red-600 px-2 py-1 rounded text-white text-sm mr-1">Fail</button>
                    <button onclick="recoverServer(${s.id})" class="btn bg-green-500 hover:bg-green-600 px-2 py-1 rounded text-white text-sm">Recover</button>
                </td>
            `;

            if (existingRow) {
                existingRow.innerHTML = rowHTML;
                existingRow.className = `border-b border-gray-700 server-row`;
                if (prev && JSON.stringify(prev) !== JSON.stringify(s)) {
                    existingRow.classList.add("highlight");
                    setTimeout(() => existingRow.classList.remove("highlight"), 800);
                }
            } else {
                const newRow = document.createElement("tr");
                newRow.id = `server-${s.id}`;
                newRow.className = `border-b border-gray-700 server-row`;
                newRow.innerHTML = rowHTML;
                table.appendChild(newRow);
            }
        }

        async function fetchLogs() {
            const res = await axios.get("/logs");
            const logDiv = document.getElementById("logs");
            logDiv.innerHTML = res.data.logs.map(l => `<div class="log-entry">${l}</div>`).join("");
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function addServer() {
            const name = document.getElementById("serverName").value;
            await axios.post("/add_server", `name=${name}`, { headers: { 'Content-Type': 'application/x-www-form-urlencoded' }});
            fetchStatus(); fetchLogs();
        }

        async function startServer(id) {
            await axios.get(`/start_server/${id}`);
            fetchStatus(); fetchLogs();
        }

        async function failServer(id) {
            await axios.get(`/fail_server/${id}`);
            fetchStatus(); fetchLogs();
        }

        async function recoverServer(id) {
            await axios.get(`/recover_server/${id}`);
            fetchStatus(); fetchLogs();
        }

        setInterval(fetchStatus, 2000);
        setInterval(fetchLogs, 2000);
        fetchStatus();
        fetchLogs();
    </script>
</body>
</html>
